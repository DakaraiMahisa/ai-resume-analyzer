
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ai-resume-analyzer-backend:local
    container_name: ai-resume-analyzer-backend
    restart: unless-stopped

    ports:
      - "8080:8080"

    env_file:
      - .env

    environment:
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME}
      SPRING_PROFILES_ACTIVE: local

    networks:
      - ai-resume-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ai-resume-analyzer-frontend:local
    container_name: ai-resume-analyzer-frontend
    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      - backend

    networks:
      - ai-resume-network

networks:
  ai-resume-network:
    external: true
    name: ai-resume-analyzer_default
