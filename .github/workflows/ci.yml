
name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend tests
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest

    env:
      VITE_API_BASE_URL: https://aira-backend.proudground-834143ea.southeastasia.azurecontainerapps.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload frontend production artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1


  docker:
    name: Security Scan & Docker Build
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Scan dependencies for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      - name: Build backend image
        run: docker build -t ai-resume-analyzer-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t ai-resume-analyzer-frontend:ci ./frontend

      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'ai-resume-analyzer-backend:ci'
          scan-type: 'image'
          scanners: 'vuln'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'ai-resume-analyzer-frontend:ci'
          scan-type: 'image'
          scanners: 'vuln'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      - name: Generate backend SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'ai-resume-analyzer-backend:ci'
          scan-type: 'image'
          format: 'cyclonedx'
          output: 'backend-sbom.cdx.json'

      - name: Generate frontend SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'ai-resume-analyzer-frontend:ci'
          scan-type: 'image'
          format: 'cyclonedx'
          output: 'frontend-sbom.cdx.json'

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: container-sboms
          path: |
            backend-sbom.cdx.json
            frontend-sbom.cdx.json
          retention-days: 30

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish backend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE=ghcr.io/dakaraimahisa/ai-resume-analyzer-backend
          docker tag ai-resume-analyzer-backend:ci $IMAGE:${GITHUB_SHA}
          docker push $IMAGE:${GITHUB_SHA}
          

  deploy:
    name: Deploy to Azure Production
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure Container Apps extension
        run: az extension add --name containerapp --upgrade

      - name: Deploy backend
        run: |
          az containerapp update \
            --name aira-backend \
            --resource-group rg-ai-resume-analyzer-prod \
            --image ghcr.io/dakaraimahisa/ai-resume-analyzer-backend:${GITHUB_SHA}

      - name: Verify backend health
        run: |
          curl --fail --silent --show-error \
            --retry 12 \
            --retry-delay 10 \
            --retry-all-errors \
            https://aira-backend.proudground-834143ea.southeastasia.azurecontainerapps.io/actuator/health

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Deploy frontend to Azure Static Web Apps
        run: |
          npx --yes @azure/static-web-apps-cli@2.1.0 deploy ./frontend/dist \
            --deployment-token "$SWA_DEPLOYMENT_TOKEN" \
            --env production
        env:
          SWA_DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}

      - name: Verify frontend deployment
        run: |
          curl --fail --silent --show-error \
            --retry 12 \
            --retry-delay 10 \
            --retry-all-errors \
            https://lively-sand-0cb751f00.8.azurestaticapps.net/
