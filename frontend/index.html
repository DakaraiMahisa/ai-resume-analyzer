<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Browser configuration -->
    <meta name="application-name" content="RoleNexa" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- SEO -->
    <title>RoleNexa — Understand Your Fit. Apply with Confidence.</title>

    <meta
      name="description"
      content="RoleNexa helps you analyse your resume against job requirements, understand your strengths and gaps, and improve your applications with explainable AI insights."
    />

    <meta name="robots" content="index, follow" />

    <link rel="canonical" href="https://rolenexa.dmahisa.me/" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RoleNexa" />
    <meta
      property="og:title"
      content="RoleNexa — Understand Your Fit. Apply with Confidence."
    />
    <meta
      property="og:description"
      content="Compare your resume with job requirements, discover your strengths and gaps, and make more informed career decisions with explainable AI insights."
    />
    <meta property="og:url" content="https://rolenexa.dmahisa.me/" />
    <meta
      property="og:image"
      content="https://rolenexa.dmahisa.me/rolenexa-social-preview.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="RoleNexa — Understand Your Fit. Apply with Confidence."
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RoleNexa — Resume Intelligence" />
    <meta
      name="twitter:description"
      content="Understand your resume-to-job fit with explainable AI insights."
    />
    <meta
      name="twitter:image"
      content="https://rolenexa.dmahisa.me/rolenexa-social-preview.jpg"
    />
    <meta
      name="twitter:image:alt"
      content="RoleNexa — Understand Your Fit. Apply with Confidence."
    />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
