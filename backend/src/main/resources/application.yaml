spring:
  application:
    name: ai-resume-analyzer

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  flyway:
    enabled: true
    locations: classpath:db/migration

  ai:
    model:
      chat: google-genai
      embedding:
        text: google-genai
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          model: ${GEMINI_CHAT_MODEL:gemini-2.5-flash}
        embedding:
          api-key: ${GEMINI_API_KEY}
          text:
            model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-2}
  output:
    ansi:
      enabled: ${LOG_ANSI_ENABLED:DETECT}

ollama:
  chat:
    base-url: ${OLLAMA_CHAT_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_CHAT_MODEL:qwen2.5:3b}
    read-timeout: ${OLLAMA_CHAT_READ_TIMEOUT:60s}

  embedding:
    base-url: ${OLLAMA_EMBEDDING_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_EMBEDDING_MODEL:qwen3-embedding:0.6b}

server:
  port: ${PORT:8080}


management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - metrics

  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
# Custom Security Config
app:
  analysis:
    quota:
      daily-limit: ${ANALYSIS_DAILY_LIMIT:10}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 15m
    refresh-token-expiration: 7d

  storage:
    provider: ${STORAGE_PROVIDER:local}
    document-directory: ${DOCUMENT_STORAGE_DIRECTORY:./storage/documents}
    b2:
      endpoint: ${B2_ENDPOINT:}
      region: ${B2_REGION:}
      bucket: ${B2_BUCKET:}
      access-key: ${B2_ACCESS_KEY:}
      secret-key: ${B2_SECRET_KEY:}

  embedding:
    provider: ${EMBEDDING_PROVIDER:ollama}

  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %cyan(%msg%n)}"
