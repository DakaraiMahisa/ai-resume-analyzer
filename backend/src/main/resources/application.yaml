spring:
  application:
    name: ai-resume-analyzer

  datasource:
    url: ${DB_URL}
    username: ${DB_USER:resume_app}
    password: ${DB_PASSWORD:resume_app_dev}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

  ai:
    model:
      chat: google-genai

    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          model: ${GEMINI_CHAT_MODEL:gemini-2.5-flash}

  output:
    ansi:
      enabled: ALWAYS
ollama:
  embedding:
    base-url: http://localhost:11434
    model: qwen3-embedding:0.6b

server:
  port: 8080
# Custom Security Config
app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 15m
    refresh-token-expiration: 7d

storage:
  document-directory: ./storage/documents

  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %cyan(%msg%n)}"
